# Loaded in addition to src/main/resources/application.yaml (classpath:/config/ is a default config location), so it
# does not replace the main file. Supplies the settings that startup requires (security, app URL);
# TestIssuerConfiguration replaces the issuer with one that signs real test tokens.
mentorhub:
  app-url: https://app.test
  security:
    trusted-issuers:
      - issuer-uri: https://issuer.test/realms/mentorhub
        audience: mentorhub-api
        jwk-set-uri: http://127.0.0.1:9/jwks
    client:
      issuer-uri: https://issuer.test/realms/mentorhub
      client-id: mentorhub-web
