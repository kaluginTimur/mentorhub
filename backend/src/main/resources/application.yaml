spring:
  application:
    name: MentorHub
  docker:
    compose:
      file: ../infra/compose.yaml
      lifecycle-management: start-only
  jpa:
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  # Email is enabled only when spring.mail.host is set; then mentorhub.mail.from is required. The timeouts (ms) keep a
  # hung mail server from holding a sending thread. Never enable mail.debug: it logs whole messages, links included.
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  # The event publication registry (spec invitation-emails, Asynchronous delivery). Modulith creates its tables itself,
  # not Flyway; completed publications are deleted, incomplete ones are published again on startup.
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      completion-mode: delete
      republish-outstanding-events-on-restart: true

# Production defaults: only health, without details, and no API docs. The dev profile serves the rest.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # The mail server is optional: an unreachable one must not make the application unhealthy.
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    url: /openapi.yaml
