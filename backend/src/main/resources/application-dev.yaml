# Development only: Swagger UI, the API docs and the actuator info and modulith endpoints.
management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

# Mailpit from infra/compose.yaml; its web UI is http://localhost:8025. TestMentorHubApplication starts no Mailpit, so
# emails sent there end FAILED.
spring:
  mail:
    host: localhost
    port: 1025
  # The sample center (SampleCenter) cleans the database on every start. Production keeps clean disabled.
  flyway:
    clean-disabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# The local Keycloak from infra/compose.yaml. Its hostname is fixed, so tokens always carry this issuer.
mentorhub:
  # The frontend dev server; invitation links point to it.
  app-url: http://localhost:4200
  mail:
    from: MentorHub <no-reply@mentorhub.local>
  security:
    trusted-issuers:
      - issuer-uri: http://localhost:8180/realms/mentorhub
        audience: mentorhub-api
    bootstrap-admin-email: admin@mentorhub.local
    client:
      issuer-uri: http://localhost:8180/realms/mentorhub
      client-id: mentorhub-web
