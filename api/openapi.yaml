        time of the request. Only a cohort without enrollments is deleted, whether or not it has mentors; its mentors
        are removed with it, each recorded as a removal. Its entries in the histories stay. A cohort of another track
        is not found. Checked in this order: the permission (403), the parameters (400), the track
        and the cohort (404), the relation (403 `forbidden`), then the conflicts (409) in the order the response lists
        them.
      parameters:
        - $ref: '#/components/parameters/TrackId'
        - $ref: '#/components/parameters/CohortId'
      responses:
        '204':
          description: The cohort is deleted
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
