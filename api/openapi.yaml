      tags: [Enrollments]
      operationId: listTrackEnrollments
      summary: Page of the enrollments of a track
      description: |
        Requires `ENROLLMENTS_READ`. For an active and an archived track alike. Sorted by the student's name
        (case-insensitive), then by the student's email, then by id. Checked in this order: the permission (403),
        the request (400), the track (404).
      parameters:
        - $ref: '#/components/parameters/TrackId'
        - name: mentor
          in: query
          description: |
            Narrows the page to the enrollments the user leads, as a mentor of the enrollment or of its cohort, each
            still with all its mentors; the order and the paging are unchanged. An id no user has, or of a user who
            leads no enrollment on the track, gives an empty page, not an error.
          schema:
            type: string
            format: uuid
        - name: cohortId
          in: query
          description: |
            Narrows the page to the enrollments in the cohort; the order and the paging are unchanged. Combines with
            `mentor`. A cohort of another track, or an id no cohort has, gives an empty page, not an error.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
