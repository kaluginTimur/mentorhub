openapi: 3.1.0
info:
  title: MentorHub API
  version: 0.1.0
  description: |
    MentorHub API contract. This is the source of truth:
    backend controller interfaces and the frontend client are generated from it.

    Every operation requires a bearer access token unless it declares `security: []`.
    Errors use RFC 9457 Problem Details (`application/problem+json`, schema `Problem`).
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: System
    description: Application service information
  - name: Users
    description: Users and the current caller
  - name: Invitations
    description: Invitations by a one-time link, and their acceptance
paths:
  /api/v1/system/info:
    get:
      tags: [System]
      operationId: getSystemInfo
      summary: Application name and version
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
  /api/v1/system/client-config:
    get:
      tags: [System]
      operationId: getClientConfig
      summary: OIDC settings for the frontend
      description: |
        Issuer, client id and scope the frontend needs to start sign-in.
        Only values that are public by nature; never a secret.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'
  /api/v1/me:
    get:
      tags: [Users]
      operationId: getMe
      summary: The caller's access status and, for an active user, the user
      description: |
        Responds 200 for every signed-in caller, including callers that are not invited or disabled.
        For `ACTIVE` the response contains `user`; for the other statuses `user` is absent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/profile:
    put:
      tags: [Users]
      operationId: updateMyProfile
      summary: Replace the caller's own profile
      description: |
        Sets the caller's first name, last name and phone. The email never changes.
        Names are trimmed (blank becomes `null`, at most 100 characters after trimming);
        the phone is normalized to E.164 (blank becomes `null`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: The caller after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Page of users
      description: |
        Requires `USERS_READ`. Sorted by last name, then first name, then email (case-insensitive,
        a missing name after present ones in its column), then id.
      parameters:
        - name: q
          in: query
          description: |
            Case-insensitive substring of the email, first name or last name, after trimming;
            `%`, `_` and `\` match themselves. At most 100 characters after trimming.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: role
          in: query
          description: A role, or `NONE` for users without any known role.
          schema:
            $ref: '#/components/schemas/RoleFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: One user
      description: Requires `USERS_READ`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{id}/history:
    get:
      tags: [Users]
      operationId: getUserHistory
      summary: The history of changes to a user, newest first
      description: |
        Requires `USERS_READ`. Entries whose action the server does not know are left out.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{id}/disable:
    post:
      tags: [Users]
      operationId: disableUser
      summary: Disable a user
      description: |
        Requires `USERS_MANAGE`. The comment is trimmed (blank becomes `null`), at most 500 characters,
        and required when the reason is `OTHER`. Disabling a disabled user changes nothing,
        including the stored reason and comment, and responds 200.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableRequest'
      responses:
        '200':
          description: The user after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LockoutConflict'
  /api/v1/users/{id}/enable:
    post:
      tags: [Users]
      operationId: enableUser
      summary: Enable a user
      description: |
        Requires `USERS_MANAGE`. Clears the disable reason and comment; roles are unchanged.
        Enabling an active user changes nothing and responds 200.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The user after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{id}/roles:
    put:
      tags: [Users]
      operationId: setUserRoles
      summary: Replace a user's roles
      description: |
        Requires `USERS_MANAGE`. The stored roles become exactly the requested set; an empty set leaves
        the user active without roles. Stored roles the server does not know are left untouched.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolesUpdate'
      responses:
        '200':
          description: The user after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LockoutConflict'
  /api/v1/users/{id}/profile:
    put:
      tags: [Users]
      operationId: updateUserProfile
      summary: Replace a user's profile
      description: |
        Requires `USERS_MANAGE`. Same rules as `PUT /api/v1/me/profile`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: The user after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/invitations:
    post:
      tags: [Invitations]
      operationId: createInvitation
      summary: Invite a person by email
      description: |
        Requires `USERS_INVITE`. The email is trimmed, must be a valid address and is at most 254 characters;
        it is stored as entered after trimming and compared ignoring case. The invitation expires after the
        configured link lifetime. The `link` appears only in this response and in the response of
        `POST /api/v1/invitations/{id}/link`; it is never returned again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '201':
          description: The invitation and its link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvitation'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvitationCreateConflict'
    get:
      tags: [Invitations]
      operationId: listInvitations
      summary: Page of invitations
      description: |
        Requires `USERS_INVITE`. Sorted by creation time, newest first, then by id.
      parameters:
        - name: q
          in: query
          description: |
            Case-insensitive substring of the email, after trimming; `%`, `_` and `\` match themselves.
            At most 254 characters after trimming.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvitationStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/invitations/{id}/revoke:
    post:
      tags: [Invitations]
      operationId: revokeInvitation
      summary: Revoke an open invitation
      description: |
        Requires `USERS_INVITE`. Only a pending or expired invitation can be revoked; its link stops working.
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: The invitation after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvitationClosed'
  /api/v1/invitations/{id}/link:
    post:
      tags: [Invitations]
      operationId: reissueInvitationLink
      summary: Issue a new link for an open invitation
      description: |
        Requires `USERS_INVITE`. Only for a pending or expired invitation. A new token replaces the old one,
        whose link stops working, and the expiry becomes now plus the configured link lifetime.
        The `link` appears only in this response.
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: The invitation after the change, and its new link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvitation'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvitationClosed'
  /api/v1/invitations/preview:
    post:
      tags: [Invitations]
      operationId: previewInvitation
      summary: The invited email and the expiry of a valid link
      description: |
        Public: needs no sign-in and ignores any bearer token. The token is in the body so that it stays out of
        access logs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/InvitationInvalid'
  /api/v1/invitations/accept:
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: Accept an invitation as the signed-in caller
      description: |
        Admits every signed-in caller, including callers that are not invited or disabled, like `GET /api/v1/me`.
        The token must have a verified email equal to the invitation's, ignoring case. Acceptance creates the user
        with that email or enables the disabled one, links the caller's identity and assigns the invitation's
        roles; for a disabled user the roles become exactly the invitation's, an active user only gains roles.
        Accepting again an invitation already accepted by the caller's user changes nothing and responds 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationToken'
      responses:
        '200':
          description: The caller after acceptance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InvitationInvalid'
        '409':
          $ref: '#/components/responses/InvitationAcceptConflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by a trusted OIDC identity provider.
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Zero-based page number.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Items per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Unauthorized:
      description: |
        No valid access token. Problem type `urn:mentorhub:problem:unauthorized`.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`, with error details when a token was sent.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        The caller may not perform the action. Problem type is one of:
        - `urn:mentorhub:problem:not-invited`: the identity is not linked to a user;
        - `urn:mentorhub:problem:access-ended`: the user is disabled;
        - `urn:mentorhub:problem:forbidden`: the user lacks the permission for the action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: |
        A parameter or a field of the request body is invalid. Problem type
        `urn:mentorhub:problem:validation-failed`, with an `errors` entry for each invalid
        parameter or field. Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    NotFound:
      description: |
        The resource does not exist or the caller may not access it. Problem type `urn:mentorhub:problem:not-found`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    LockoutConflict:
      description: |
        The change would lock the installation out; nothing was changed. Problem type is one of:
        - `urn:mentorhub:problem:self-lockout`: the caller would disable themselves or remove their own ADMIN role;
        - `urn:mentorhub:problem:last-admin`: no other active user with the ADMIN role would remain.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvitationCreateConflict:
      description: |
        The email cannot be invited now; nothing was created. Schema `InvitationConflictProblem`; problem type is one of:
        - `urn:mentorhub:problem:user-active`: an active user has the email (ignoring case); extension `userId`;
        - `urn:mentorhub:problem:invitation-exists`: an open (pending or expired) invitation for the email exists;
          extension `invitationId`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InvitationConflictProblem'
    InvitationClosed:
      description: |
        The invitation is accepted or revoked; nothing was changed. Problem type `urn:mentorhub:problem:invitation-closed`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvitationInvalid:
      description: |
        The token does not exist, is malformed, was replaced by a new link, or belongs to an expired, revoked or
        accepted invitation. The response is the same in every case. Problem type
        `urn:mentorhub:problem:invitation-invalid`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvitationAcceptConflict:
      description: |
        The caller cannot accept this invitation; nothing was changed and the invitation stays pending.
        Problem type is one of:
        - `urn:mentorhub:problem:invitation-email-mismatch`: the token's email is not verified or differs from the
          invitation's email;
        - `urn:mentorhub:problem:identity-linked-elsewhere`: the caller's identity is linked to a user other than the
          user with the invitation's email.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SystemInfo:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          examples: [MentorHub]
        version:
          type: string
          examples: [0.0.1-SNAPSHOT]
    ClientConfig:
      type: object
      required: [issuer, clientId, scope]
      properties:
        issuer:
          type: string
          format: uri
          examples: ['http://localhost:8180/realms/mentorhub']
        clientId:
          type: string
          examples: [mentorhub-web]
        scope:
          type: string
          description: Space-separated OIDC scopes to request.
          examples: [openid profile email]
    AccessStatus:
      type: string
      description: |
        - `ACTIVE`: a linked, active user;
        - `DISABLED`: a linked user whose access has ended;
        - `NOT_INVITED`: the identity is not linked to any user.
      enum: [ACTIVE, DISABLED, NOT_INVITED]
    Me:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/AccessStatus'
        user:
          $ref: '#/components/schemas/MeUser'
          description: Present only when `status` is `ACTIVE`; absent (not `null`) otherwise.
    MeUser:
      type: object
      required: [id, email, firstName, lastName, phone, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          examples: [anna@example.com]
        firstName:
          type: [string, 'null']
          examples: [Anna]
        lastName:
          type: [string, 'null']
          examples: [Petrova]
        phone:
          type: [string, 'null']
          description: E.164.
          examples: ['+77011234567']
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          description: The union of the permissions of all roles.
          items:
            $ref: '#/components/schemas/Permission'
    Role:
      type: string
      description: Must equal the `Role` enum in the backend code.
      enum: [ADMIN, COORDINATOR, MENTOR, STUDENT, OBSERVER]
    Permission:
      type: string
      description: Must equal the `Permission` enum in the backend code.
      enum: [USERS_READ, USERS_MANAGE, USERS_INVITE]
    Problem:
      type: object
      description: |
        RFC 9457 Problem Details. MentorHub problem types:
        `urn:mentorhub:problem:unauthorized`, `urn:mentorhub:problem:not-invited`,
        `urn:mentorhub:problem:access-ended`, `urn:mentorhub:problem:forbidden`,
        `urn:mentorhub:problem:not-found`, `urn:mentorhub:problem:validation-failed`
        (schema `ValidationProblem`), `urn:mentorhub:problem:self-lockout`,
        `urn:mentorhub:problem:last-admin`, `urn:mentorhub:problem:invitation-invalid`,
        `urn:mentorhub:problem:user-active` and `urn:mentorhub:problem:invitation-exists`
        (schema `InvitationConflictProblem`), `urn:mentorhub:problem:invitation-closed`,
        `urn:mentorhub:problem:invitation-email-mismatch`, `urn:mentorhub:problem:identity-linked-elsewhere`.
        Other errors use `about:blank`.
        Other RFC 9457 members (such as `instance`) may be present.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ['urn:mentorhub:problem:forbidden']
        title:
          type: string
          examples: [Forbidden]
        status:
          type: integer
          format: int32
          examples: [403]
        detail:
          type: string
    ValidationProblem:
      description: A `Problem` of type `urn:mentorhub:problem:validation-failed`.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/ValidationError'
    InvitationConflictProblem:
      description: |
        A `Problem` of type `urn:mentorhub:problem:user-active` (with `userId`) or
        `urn:mentorhub:problem:invitation-exists` (with `invitationId`).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            userId:
              type: string
              format: uuid
              description: The active user with the email. Present only for `user-active`.
            invitationId:
              type: string
              format: uuid
              description: The open invitation for the email. Present only for `invitation-exists`.
    ValidationError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: The query or path parameter name, or the request body property name.
          examples: [size]
        message:
          type: string
          examples: [must be between 1 and 100]
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    RoleFilter:
      type: string
      description: |
        A `Role`, or `NONE` for users without any role the server knows. Must equal the `Role` values plus `NONE`.
      enum: [ADMIN, COORDINATOR, MENTOR, STUDENT, OBSERVER, NONE]
    DisableReason:
      type: string
      description: |
        Why a user was disabled. Must equal the `DisableReason` enum in the backend code.
        - `GRADUATED`: graduated;
        - `EXPELLED`: expelled;
        - `LEFT_PROGRAM`: left the program;
        - `STAFF_OFFBOARDED`: no longer on staff;
        - `SECURITY`: security concern;
        - `OTHER`: other; a comment is required.
      enum: [GRADUATED, EXPELLED, LEFT_PROGRAM, STAFF_OFFBOARDED, SECURITY, OTHER]
    UserSummary:
      type: object
      required: [id, email, firstName, lastName, status, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          examples: [ivan@example.com]
        firstName:
          type: [string, 'null']
          examples: [Ivan]
        lastName:
          type: [string, 'null']
          examples: [Sidorov]
        status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          description: The user's roles the server knows.
          items:
            $ref: '#/components/schemas/Role'
    UserDetails:
      type: object
      description: '`UserSummary` with the profile, the disable reason and the creation time.'
      required: [id, email, firstName, lastName, phone, status, roles, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          examples: [ivan@example.com]
        firstName:
          type: [string, 'null']
          examples: [Ivan]
        lastName:
          type: [string, 'null']
          examples: [Sidorov]
        phone:
          type: [string, 'null']
          description: E.164.
          examples: ['+77011234567']
        status:
          $ref: '#/components/schemas/UserStatus'
        disabledReason:
          $ref: '#/components/schemas/DisableReason'
          description: Present only when `status` is `DISABLED`; absent (not `null`) otherwise.
        disabledComment:
          type: string
          description: Present only when `status` is `DISABLED` and a comment was given; absent (not `null`) otherwise.
          examples: [Finished the spring cohort]
        roles:
          type: array
          description: The user's roles the server knows.
          items:
            $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
    UserPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        page:
          type: integer
          format: int32
          description: Zero-based page number.
        size:
          type: integer
          format: int32
          description: The requested page size.
        totalItems:
          type: integer
          format: int64
          description: The number of matching items on all pages.
    DisableRequest:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/DisableReason'
        comment:
          type: string
          description: Optional except for `OTHER`. Trimmed; at most 500 characters after trimming; blank means none.
          examples: [Finished the spring cohort]
    RolesUpdate:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          description: The complete set of roles the user should have; may be empty.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
    ProfileUpdate:
      type: object
      description: The whole profile; every property must be sent, `null` or blank for none.
      required: [firstName, lastName, phone]
      properties:
        firstName:
          type: [string, 'null']
          description: Trimmed; at most 100 characters after trimming.
          examples: [Ivan]
        lastName:
          type: [string, 'null']
          description: Trimmed; at most 100 characters after trimming.
          examples: [Sidorov]
        phone:
          type: [string, 'null']
          description: |
            Parsed with the server's default region when written without `+`; must be a valid number.
            Stored and returned in E.164.
          examples: [8 701 123 45 67]
    HistoryAction:
      type: string
      description: |
        The actions a user's history shows. A feature that writes a new action about a user extends this enum
        in the same change.
        - `USER_DISABLED`: details `reason`, `comment`;
        - `USER_ENABLED`: details `reason`, `comment` the user had been disabled with;
        - `USER_ROLES_CHANGED`: details `rolesAdded`, `rolesRemoved`;
        - `USER_PROFILE_UPDATED`: details `changes`;
        - `USER_BOOTSTRAPPED_ADMIN`: details `bootstrap`; no actor;
        - `USER_INVITATION_ACCEPTED`: details `invitation`, `rolesAdded`, `rolesRemoved`; the actor is the user.
      enum:
        - USER_DISABLED
        - USER_ENABLED
        - USER_ROLES_CHANGED
        - USER_PROFILE_UPDATED
        - USER_BOOTSTRAPPED_ADMIN
        - USER_INVITATION_ACCEPTED
    HistoryActor:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: First and last name joined by a space, or the email when both are missing.
          examples: [Anna Petrova]
    HistoryEntry:
      type: object
      description: |
        One change to a user. Detail properties that do not apply to the action are absent (not `null`).
      required: [id, occurredAt, action, actor]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        action:
          $ref: '#/components/schemas/HistoryAction'
        actor:
          description: Who made the change; `null` for a change made by the system.
          oneOf:
            - $ref: '#/components/schemas/HistoryActor'
            - type: 'null'
        reason:
          $ref: '#/components/schemas/DisableReason'
        comment:
          type: string
        rolesAdded:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        rolesRemoved:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ProfileChange'
        bootstrap:
          $ref: '#/components/schemas/BootstrapChanges'
        invitation:
          $ref: '#/components/schemas/InvitationAcceptance'
    ProfileField:
      type: string
      enum: [firstName, lastName, phone]
    ProfileChange:
      type: object
      required: [field, oldValue, newValue]
      properties:
        field:
          $ref: '#/components/schemas/ProfileField'
        oldValue:
          type: [string, 'null']
        newValue:
          type: [string, 'null']
    BootstrapChanges:
      type: object
      description: What the administrator bootstrap (ADR 0005) did.
      required: [userCreated, identityLinked, enabled, adminAdded]
      properties:
        userCreated:
          type: boolean
        identityLinked:
          type: boolean
        enabled:
          type: boolean
        adminAdded:
          type: boolean
    InvitationAcceptance:
      type: object
      description: What accepting an invitation did. The roles added and removed are in `rolesAdded` and `rolesRemoved`.
      required: [invitationId, invitedBy, userCreated, identityLinked, enabled]
      properties:
        invitationId:
          type: string
          format: uuid
        invitedBy:
          description: The administrator who created the invitation; `null` when they cannot be resolved.
          oneOf:
            - $ref: '#/components/schemas/HistoryActor'
            - type: 'null'
        userCreated:
          type: boolean
        identityLinked:
          type: boolean
        enabled:
          type: boolean
          description: The user was disabled and has been enabled (reactivated).
    HistoryPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
        page:
          type: integer
          format: int32
          description: Zero-based page number.
        size:
          type: integer
          format: int32
          description: The requested page size.
        totalItems:
          type: integer
          format: int64
          description: The number of entries on all pages.
    InvitationStatus:
      type: string
      description: |
        Derived from the invitation's times, in this order:
        - `ACCEPTED`: accepted;
        - `REVOKED`: revoked;
        - `EXPIRED`: open, and the expiry has passed;
        - `PENDING`: open, and the link is valid.
      enum: [PENDING, EXPIRED, ACCEPTED, REVOKED]
    Invitation:
      type: object
      description: |
        An invitation. `acceptedAt` and `acceptedUser` are present only when accepted, `revokedAt` and `revokedBy` only
        when revoked; absent (not `null`) otherwise. The link is never part of it.
      required: [id, email, roles, status, createdAt, expiresAt, createdBy]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          examples: [ivan@example.com]
        roles:
          type: array
          description: The roles the invitation gives that the server knows.
          items:
            $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/InvitationStatus'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/HistoryActor'
        acceptedAt:
          type: string
          format: date-time
        acceptedUser:
          $ref: '#/components/schemas/HistoryActor'
        revokedAt:
          type: string
          format: date-time
        revokedBy:
          $ref: '#/components/schemas/HistoryActor'
    CreatedInvitation:
      type: object
      description: An invitation with its link. The link is returned only once.
      required: [invitation, link]
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        link:
          type: string
          format: uri
          description: '`<app-url>/invite/<token>`.'
          examples: ['http://localhost:4200/invite/Xf3kq9WvT0bD2mJ7sL1pR8yZ4cN6hA5eG0uI3oK9wQe']
    InvitationPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        page:
          type: integer
          format: int32
          description: Zero-based page number.
        size:
          type: integer
          format: int32
          description: The requested page size.
        totalItems:
          type: integer
          format: int64
          description: The number of matching items on all pages.
    InvitationCreate:
      type: object
      required: [email, roles]
      properties:
        email:
          type: string
          description: Trimmed; a valid address of at most 254 characters after trimming.
          examples: [ivan@example.com]
        roles:
          type: array
          description: The roles the person gets on acceptance; may be empty.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
    InvitationToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: |
            The token from the link. Its length is bounded only to limit the public request body; any other malformed
            token responds 404 `invitation-invalid`.
          minLength: 1
          maxLength: 200
    InvitationPreview:
      type: object
      required: [email, expiresAt]
      properties:
        email:
          type: string
          examples: [ivan@example.com]
        expiresAt:
          type: string
          format: date-time
