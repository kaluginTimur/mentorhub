      summary: Enroll a student on an active track
      description: |
        Requires `ENROLLMENTS_MANAGE`, or `ENROLLMENTS_MANAGE_COORDINATED` and being a coordinator of the track at the
        time of the request. Only an active user with the `STUDENT` role and no active enrollment, on any track, can
        be enrolled; a disabled user, a user without the role and an id no user has are refused alike with 409
        `student-not-eligible`. The start date may be any date, past or future; the enrollment is `ACTIVE` from the
        moment it is recorded. A cohort given must be a cohort of the track: a cohort of another track and an id no
        cohort has are refused alike with 409 `cohort-not-eligible`. An invalid body is answered 400 whoever sends it, before the permission is checked.
        Otherwise checked in this order: the permission (403), the parameters (400), the track (404), the relation
        (403 `forbidden`), then the conflicts (409) in the order the response lists them.
      parameters:
        - $ref: '#/components/parameters/TrackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentCreate'
      responses:
        '201':
          description: The new enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackEnrollment'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EnrollmentConflict'
