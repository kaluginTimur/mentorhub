openapi: 3.1.0
info:
  title: MentorHub API
  version: 0.1.0
  description: |
    MentorHub API contract. This is the source of truth:
    backend controller interfaces and the frontend client are generated from it.

    Every operation requires a bearer access token unless it declares `security: []`.
    Errors use RFC 9457 Problem Details (`application/problem+json`, schema `Problem`).
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: System
    description: Application service information
  - name: Users
    description: Users and the current caller
  - name: Invitations
    description: Invitations by link, and their acceptance
  - name: Tracks
    description: The tracks of the training center, their coordinators and their mentors
  - name: Enrollments
    description: Who studies on which track
  - name: Cohorts
    description: The intakes of a track and their enrollments
paths:
  /api/v1/system/info:
    get:
      tags: [System]
      operationId: getSystemInfo
      summary: Application name and version
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
  /api/v1/system/client-config:
    get:
      tags: [System]
      operationId: getClientConfig
      summary: OIDC settings and enabled features for the frontend
      description: |
        Issuer, client id and scope the frontend needs to start sign-in, and whether optional features are enabled.
        Only values that are public by nature; never a secret.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'
  /api/v1/me:
    get:
      tags: [Users]
      operationId: getMe
      summary: The caller's access status and, for an active user, the user
      description: |
        Responds 200 for every signed-in caller, including callers that are not invited or disabled.
        For `ACTIVE` the response contains `user`; for the other statuses `user` is absent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/enrollments:
    get:
      tags: [Enrollments]
      operationId: listMyEnrollments
      summary: The caller's own enrollments
      description: |
        Every active user, whatever roles they hold; no permission is needed. Only the caller's own enrollments, none
        of anyone else's; empty for a caller without an enrollment. Not paged: a user has at most one active enrollment
        at a time.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyEnrollmentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me/students:
    get:
      tags: [Enrollments]
      operationId: listMyStudents
      summary: Page of the enrollments the caller leads
      description: |
        Requires `ENROLLMENTS_READ_MENTORED`. Only the active enrollments the caller leads at the time of the request,
        as a mentor of the enrollment or of its cohort, each once, none of anyone else's; empty for a caller who leads
        no enrollment. Sorted by the student's name (case-insensitive), then by the student's email, then by id.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentoredEnrollmentPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me/profile:
    put:
      tags: [Users]
      operationId: updateMyProfile
      summary: Replace the caller's own profile
      description: |
        Sets the caller's first name, last name and phone. The email never changes.
        Names are trimmed (blank becomes `null`, at most 100 characters after trimming);
        the phone is normalized to E.164 (blank becomes `null`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: The caller after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Page of users
      description: |
        Requires `USERS_READ`. Sorted by last name, then first name, then email (case-insensitive,
        a missing name after present ones in its column), then id.
      parameters:
        - name: q
          in: query
          description: |
            Case-insensitive substring of the email, first name or last name, after trimming;
            `%`, `_` and `\` match themselves. At most 100 characters after trimming.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: role
          in: query
          description: A role, or `NONE` for users without any known role.
          schema:
            $ref: '#/components/schemas/RoleFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: One user
      description: Requires `USERS_READ`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{id}/history:
    get:
      tags: [Users]
      operationId: getUserHistory
      summary: The history of changes to a user, newest first
      description: |
        Requires `USERS_READ`. Entries whose action the server does not know are left out.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{id}/disable:
    post:
      tags: [Users]
      operationId: disableUser
      summary: Disable a user
      description: |
        Requires `USERS_MANAGE`. The comment is trimmed (blank becomes `null`), at most 500 characters,
        and required when the reason is `OTHER`. Disabling a disabled user changes nothing,
        including the stored reason and comment, and responds 200.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableRequest'
      responses:
        '200':
          description: The user after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LockoutConflict'
  /api/v1/users/{id}/enable:
    post:
      tags: [Users]
      operationId: enableUser
      summary: Enable a user
      description: |
        Requires `USERS_MANAGE`. Clears the disable reason and comment; roles are unchanged.
        Enabling an active user changes nothing and responds 200.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The user after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{id}/roles:
    put:
      tags: [Users]
      operationId: setUserRoles
      summary: Replace a user's roles
      description: |
        Requires `USERS_MANAGE`. The stored roles become exactly the requested set; an empty set leaves
        the user active without roles. Stored roles the server does not know are left untouched.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolesUpdate'
      responses:
        '200':
          description: The user after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LockoutConflict'
  /api/v1/users/{id}/profile:
    put:
      tags: [Users]
      operationId: updateUserProfile
      summary: Replace a user's profile
      description: |
        Requires `USERS_MANAGE`. Same rules as `PUT /api/v1/me/profile`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: The user after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/invitations:
    post:
      tags: [Invitations]
      operationId: createInvitation
      summary: Invite a person by email
      description: |
        Requires `USERS_INVITE`. The email is trimmed, must be a valid address and is at most 254 characters;
        it is stored as entered after trimming and compared ignoring case. The invitation expires after the
        configured link lifetime. The `link` is returned in this response, in the response of
        `POST /api/v1/invitations/{id}/link`, and by `GET /api/v1/invitations/{id}/link` while the invitation is
        pending; no other response contains it.

        With `sendEmail: true` an email with the link to the invited address is also requested in the same
        transaction; it is sent asynchronously after the commit, and the returned invitation carries it as
        `lastEmail` with status `QUEUED`. This needs a configured mail server (`invitationEmails` in
        `GET /api/v1/system/client-config`), otherwise the response is 409 `email-unavailable` and nothing is created.
        If the invitation cannot be created, no email is requested.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '201':
          description: The invitation and its link
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvitation'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvitationCreateConflict'
    get:
      tags: [Invitations]
      operationId: listInvitations
      summary: Page of invitations
      description: |
        Requires `USERS_INVITE`. Sorted by creation time, newest first, then by id.
      parameters:
        - name: q
          in: query
          description: |
            Case-insensitive substring of the email, after trimming; `%`, `_` and `\` match themselves.
            At most 254 characters after trimming.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvitationStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/invitations/{id}/revoke:
    post:
      tags: [Invitations]
      operationId: revokeInvitation
      summary: Revoke an open invitation
      description: |
        Requires `USERS_INVITE`. Only a pending or expired invitation can be revoked; its link stops working.
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: The invitation after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvitationClosed'
  /api/v1/invitations/{id}/link:
    get:
      tags: [Invitations]
      operationId: getInvitationLink
      summary: The link of a pending invitation
      description: |
        Requires `USERS_INVITE`. Returns the current link of a pending invitation, the same as in the response that
        created or last replaced it; reading it changes nothing. An expired invitation has no link to copy: issue a
        new one with `POST /api/v1/invitations/{id}/link`.
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: The link, with the email it is for and its expiry
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationLink'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvitationLinkUnavailable'
    post:
      tags: [Invitations]
      operationId: reissueInvitationLink
      summary: Issue a new link for an open invitation
      description: |
        Requires `USERS_INVITE`. Only for a pending or expired invitation. A new token replaces the old one,
        whose link stops working, and the expiry becomes now plus the configured link lifetime.
        While the invitation is pending, `GET /api/v1/invitations/{id}/link` returns the new link again.

        The body is optional; without it, or with `sendEmail: false`, no email is requested. With
        `sendEmail: true` an email with the new link is requested as in `POST /api/v1/invitations`, and the
        returned invitation carries it as `lastEmail`. If the invitation's latest email is still `QUEUED`, no second
        email is requested and the response carries the queued one: it builds its link when it is sent, so it
        carries the new link. Without a configured mail server the response is 409 `email-unavailable` and nothing
        is changed.
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationLinkReissue'
      responses:
        '200':
          description: The invitation after the change, and its new link
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvitation'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvitationLinkReissueConflict'
  /api/v1/invitations/{id}/email:
    post:
      tags: [Invitations]
      operationId: sendInvitationEmail
      summary: Email the current link of a pending invitation
      description: |
        Requires `USERS_INVITE`; any holder can send it, not only the inviter. Requests an email with the current
        link to the invited address; the token and the expiry stay unchanged. The email is sent asynchronously after
        the commit; the returned invitation carries it as `lastEmail` with status `QUEUED`. The operation has no
        request body, and its response does not contain the link.
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '202':
          description: The email is requested; the invitation with it as `lastEmail`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvitationEmailConflict'
  /api/v1/invitations/preview:
    post:
      tags: [Invitations]
      operationId: previewInvitation
      summary: The invited email and the expiry of a valid link
      description: |
        Public: needs no sign-in and ignores any bearer token. The token is in the body so that it stays out of
        access logs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/InvitationInvalid'
  /api/v1/invitations/accept:
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: Accept an invitation as the signed-in caller
      description: |
        Admits every signed-in caller, including callers that are not invited or disabled, like `GET /api/v1/me`.
        The token must have a verified email equal to the invitation's, ignoring case. Acceptance creates the user
        with that email or enables the disabled one, links the caller's identity and assigns the invitation's
        roles; for a disabled user the roles become exactly the invitation's, an active user only gains roles.
        Accepting again an invitation already accepted by the caller's user changes nothing and responds 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationToken'
      responses:
        '200':
          description: The caller after acceptance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InvitationInvalid'
        '409':
          $ref: '#/components/responses/InvitationAcceptConflict'
  /api/v1/tracks:
    get:
      tags: [Tracks]
      operationId: listTracks
      summary: All tracks of a status
      description: |
        Requires `TRACKS_READ`. Not paged. Sorted by code, then by name (case-insensitive); the order of tracks with
        the same code and name is not defined.
      parameters:
        - name: status
          in: query
          description: The status of the listed tracks, or `ALL` for every track.
          schema:
            $ref: '#/components/schemas/TrackStatusFilter'
            default: ACTIVE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackList'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Tracks]
      operationId: createTrack
      summary: Create a track
      description: |
        Requires `TRACKS_MANAGE`. The track is created `ACTIVE`, without coordinators or mentors. Neither the code nor
        the name has to be unique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackCreate'
      responses:
        '201':
          description: The new track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tracks/{id}:
    get:
      tags: [Tracks]
      operationId: getTrack
      summary: One track
      description: Requires `TRACKS_READ`. An active or an archived track.
      parameters:
        - $ref: '#/components/parameters/TrackId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Tracks]
      operationId: updateTrack
      summary: Replace the code and the name of an active track
      description: |
        Requires `TRACKS_MANAGE`. The code and the name are set independently: a value sent unchanged stays as it is.
        Saving both unchanged changes nothing and responds 200. Checked in this order: the request (400), the track
        (404), its status (409 `track-archived`, even when nothing would change).
      parameters:
        - $ref: '#/components/parameters/TrackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackUpdate'
      responses:
        '200':
          description: The track after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TrackArchived'
  /api/v1/tracks/{id}/archive:
    post:
      tags: [Tracks]
      operationId: archiveTrack
      summary: Archive a track
      description: |
        Requires `TRACKS_MANAGE`. The track becomes `ARCHIVED` and read-only, and keeps its coordinators and mentors.
        Archiving an archived track changes nothing and responds 200. An active track with an active enrollment is not archived:
        409 `track-has-active-enrollments`.
      parameters:
        - $ref: '#/components/parameters/TrackId'
      responses:
        '200':
          description: The track after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TrackHasActiveEnrollments'
  /api/v1/tracks/{id}/restore:
    post:
      tags: [Tracks]
      operationId: restoreTrack
      summary: Restore an archived track
      description: |
        Requires `TRACKS_MANAGE`. The track becomes `ACTIVE` with the coordinators and mentors it had. Restoring an
        active track changes nothing and responds 200.
      parameters:
        - $ref: '#/components/parameters/TrackId'
      responses:
        '200':
          description: The track after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
