                $ref: '#/components/schemas/MentorAssignmentCandidatePage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TrackArchived'
  /api/v1/tracks/{id}/cohort-candidates:
    get:
      tags: [Cohorts]
      operationId: listNewCohortCandidates
      summary: Page of the enrollments that may be added to a new cohort of a track
      description: |
        Requires `ENROLLMENTS_MANAGE`, or `ENROLLMENTS_MANAGE_COORDINATED` and being a coordinator of the track at the
        time of the request; `USERS_READ` is not needed. The active enrollments of the track, each with the cohort it
        is in now, sorted by the student's name (case-insensitive), then by the student's email, then by id. An
        archived track has no candidates to offer until it is restored: 409 `track-archived`. Checked in this order:
        the permission (403), the request (400), the track (404), the relation (403 `forbidden`), its status (409).
      parameters:
        - $ref: '#/components/parameters/TrackId'
        - name: q
          in: query
          description: |
            Case-insensitive substring of the student's email, first name or last name, after trimming;
            `%`, `_` and `\` match themselves. At most 100 characters after trimming.
          schema:
            type: string
        - name: withoutCohort
          in: query
          description: Narrows the page to the enrollments in no cohort.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortCandidatePage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TrackArchived'
  /api/v1/tracks/{id}/cohorts/{cohortId}/candidates:
    get:
      tags: [Cohorts]
      operationId: listCohortCandidates
      summary: Page of the enrollments that may be added to a cohort
      description: |
        Requires `ENROLLMENTS_MANAGE`, or `ENROLLMENTS_MANAGE_COORDINATED` and being a coordinator of the track at the
        time of the request; `USERS_READ` is not needed. The active enrollments of the track that are not in the
        cohort, each with the cohort it is in now, sorted by the student's name (case-insensitive), then by the
        student's email, then by id. A cohort of another track is not found. An archived track has no candidates to
        offer until it is restored: 409 `track-archived`. Checked in this order: the permission (403), the request
        (400), the track and the cohort (404), the relation (403 `forbidden`), its status (409).
      parameters:
        - $ref: '#/components/parameters/TrackId'
        - $ref: '#/components/parameters/CohortId'
        - name: q
          in: query
          description: |
            Case-insensitive substring of the student's email, first name or last name, after trimming;
            `%`, `_` and `\` match themselves. At most 100 characters after trimming.
          schema:
            type: string
        - name: withoutCohort
          in: query
          description: Narrows the page to the enrollments in no cohort.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortCandidatePage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TrackArchived'
  /api/v1/enrollments/{id}/mentor-candidates:
    get:
      tags: [Enrollments]
      operationId: listMentorCandidates
      summary: Page of the users who may be assigned as mentors of an enrollment
      description: |
        Requires `ENROLLMENTS_MANAGE`, or `ENROLLMENTS_MANAGE_COORDINATED` and being a coordinator of the enrollment's
        track at the time of the request; `USERS_READ` is not needed. The active users with the `MENTOR` role who are
        mentors of the enrollment's track and not mentors of the enrollment, a mentor of its cohort included, each with
        what they lead on the track, sorted by name (case-insensitive), then by email, then by id. Checked in this
        order: the permission (403), the request (400), the enrollment (404), the
        relation (403 `forbidden`).
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - name: q
          in: query
          description: |
            Case-insensitive substring of the email, first name or last name, after trimming;
            `%`, `_` and `\` match themselves. At most 100 characters after trimming.
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MentorAssignmentCandidatePage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/enrollments/{id}/mentors/{userId}:
    put:
      tags: [Enrollments]
      operationId: assignEnrollmentMentor
      summary: Assign a user as a mentor of an enrollment
      description: |
        Requires `ENROLLMENTS_MANAGE`, or `ENROLLMENTS_MANAGE_COORDINATED` and being a coordinator of the enrollment's
        track at the time of the request. Only an active user with the `MENTOR` role who is a mentor of the
        enrollment's track can be assigned, the student of the enrollment and the caller included, whatever the
        student's status or roles; a disabled user, a user without the role, a user who is not a mentor of the track
        and an id no user has are refused alike with 409 `mentor-not-eligible`. Assigning a mentor of
        the enrollment again changes nothing and responds 200, even when they are no longer eligible (disabled or
        without the role). A mentor of the enrollment's cohort is assigned directly, as any other user. The operation
        has no request body. Checked in this order: the permission (403), the
        parameters (400), the enrollment (404), the relation (403 `forbidden`), the eligibility (409).
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - $ref: '#/components/parameters/MentorUserId'
      responses:
        '200':
          description: The enrollment after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackEnrollment'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MentorNotEligible'
    delete:
      tags: [Enrollments]
      operationId: removeEnrollmentMentor
      summary: Remove a mentor of an enrollment
      description: |
        Requires `ENROLLMENTS_MANAGE`, or `ENROLLMENTS_MANAGE_COORDINATED` and being a coordinator of the enrollment's
        track at the time of the request. Any mentor can be removed, also one who is disabled or no longer has the
        `MENTOR` role. Removing a user who is not a mentor of the enrollment, or an id no user has, changes nothing and
        responds 200; so does removing a mentor of the enrollment's cohort who is not a mentor of the enrollment
        itself, who still leads it through the cohort. Checked in this order: the permission (403), the parameters (400), the enrollment (404), the
        relation (403 `forbidden`).
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - $ref: '#/components/parameters/MentorUserId'
      responses:
        '200':
          description: The enrollment after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackEnrollment'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by a trusted OIDC identity provider.
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrackId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CoordinatorUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnrollmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MentorUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CohortId:
      name: cohortId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CohortEnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Zero-based page number.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Items per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 25
  headers:
    NoStore:
      description: Always `no-store`. The response contains an invitation link, which must not be cached.
      schema:
        type: string
        enum: [no-store]
  responses:
    Unauthorized:
      description: |
        No valid access token. Problem type `urn:mentorhub:problem:unauthorized`.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`, with error details when a token was sent.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        The caller may not perform the action. Problem type is one of:
        - `urn:mentorhub:problem:not-invited`: the identity is not linked to a user;
        - `urn:mentorhub:problem:access-ended`: the user is disabled;
        - `urn:mentorhub:problem:forbidden`: the user lacks the permission for the action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: |
        A parameter or a field of the request body is invalid. Problem type
        `urn:mentorhub:problem:validation-failed`, with an `errors` entry for each invalid
        parameter or field. A body that is not JSON or missing keeps generic `Problem`
        with type `about:blank`. Nothing was changed.
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ValidationProblem'
              - $ref: '#/components/schemas/Problem'
    NotFound:
      description: |
        The resource does not exist or the caller may not access it. Problem type `urn:mentorhub:problem:not-found`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    LockoutConflict:
      description: |
        The change would lock the installation out; nothing was changed. Problem type is one of:
        - `urn:mentorhub:problem:self-lockout`: the caller would disable themselves or remove their own ADMIN role;
        - `urn:mentorhub:problem:last-admin`: no other active user with the ADMIN role would remain.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvitationCreateConflict:
      description: |
        The invitation cannot be created now; nothing was created. Schema `InvitationConflictProblem`; problem type is
        one of, checked in this order:
        - `urn:mentorhub:problem:user-active`: an active user has the email (ignoring case); extension `userId`;
        - `urn:mentorhub:problem:invitation-exists`: an open (pending or expired) invitation for the email exists;
          extension `invitationId`;
        - `urn:mentorhub:problem:email-unavailable`: `sendEmail` is `true` and no mail server is configured; no
          extension.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InvitationConflictProblem'
    InvitationClosed:
      description: |
        The invitation is accepted or revoked; nothing was changed. Problem type `urn:mentorhub:problem:invitation-closed`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvitationLinkReissueConflict:
      description: |
        No new link was issued; nothing was changed. Problem type is one of, checked in this order:
        - `urn:mentorhub:problem:invitation-closed`: the invitation is accepted or revoked;
        - `urn:mentorhub:problem:email-unavailable`: `sendEmail` is `true` and no mail server is configured.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvitationEmailConflict:
      description: |
        No email was requested; nothing was changed. Problem type is one of, checked in this order:
        - `urn:mentorhub:problem:invitation-closed`: the invitation is accepted or revoked;
        - `urn:mentorhub:problem:invitation-expired`: the invitation is open but expired; a new link renews it;
        - `urn:mentorhub:problem:email-unavailable`: no mail server is configured;
        - `urn:mentorhub:problem:email-queued`: the invitation's latest email is still `QUEUED`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvitationLinkUnavailable:
      description: |
        The invitation has no link to return; nothing was changed. Problem type is one of:
        - `urn:mentorhub:problem:invitation-closed`: the invitation is accepted or revoked;
        - `urn:mentorhub:problem:invitation-expired`: the invitation is open but expired; a new link renews it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvitationInvalid:
      description: |
        The token does not exist, is malformed, was replaced by a new link, or belongs to an expired, revoked or
        accepted invitation. The response is the same in every case. Problem type
        `urn:mentorhub:problem:invitation-invalid`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvitationAcceptConflict:
      description: |
        The caller cannot accept this invitation; nothing was changed and the invitation stays pending.
        Problem type is one of:
        - `urn:mentorhub:problem:invitation-email-mismatch`: the token's email is not verified or differs from the
          invitation's email;
        - `urn:mentorhub:problem:identity-linked-elsewhere`: the caller's identity is linked to a user other than the
          user with the invitation's email.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TrackArchived:
      description: |
        The track is archived and read-only until restored; nothing was changed. Problem type
        `urn:mentorhub:problem:track-archived`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TrackCoordinatorConflict:
      description: |
        The user was not named; nothing was changed. Problem type is one of, checked in this order:
        - `urn:mentorhub:problem:track-archived`: the track is archived and read-only until restored;
        - `urn:mentorhub:problem:coordinator-not-eligible`: the id is not a coordinator of the track and no active user
          with the `COORDINATOR` role has it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TrackMentorConflict:
      description: |
        The user was not named; nothing was changed. Problem type is one of, checked in this order:
        - `urn:mentorhub:problem:track-archived`: the track is archived and read-only until restored;
        - `urn:mentorhub:problem:mentor-not-eligible`: the id is not a mentor of the track and no active user with the
          `MENTOR` role has it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TrackMentorRemovalConflict:
      description: |
        The mentor was not removed; nothing was changed. Problem type is one of, checked in this order:
        - `urn:mentorhub:problem:track-archived`: the track is archived and read-only until restored;
        - `urn:mentorhub:problem:mentor-leads-enrollments`: the user is a mentor of an active enrollment on the track;
          removed from those enrollments first, they can be removed from the track;
        - `urn:mentorhub:problem:mentor-leads-cohorts`: the user is a mentor of no active enrollment on the track but
          of a cohort of it, with enrollments or without; removed from those cohorts first, they can be removed from
          the track.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TrackHasActiveEnrollments:
      description: |
        The track has an active enrollment and stays active; nothing was changed. Problem type
        `urn:mentorhub:problem:track-has-active-enrollments`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EnrollmentConflict:
      description: |
        The student was not enrolled; nothing was changed. Problem type is one of, checked in this order:
        - `urn:mentorhub:problem:track-archived`: the track is archived and read-only until restored;
        - `urn:mentorhub:problem:cohort-not-eligible`: the track has no cohort with the id `cohortId`;
        - `urn:mentorhub:problem:student-not-eligible`: no active user with the `STUDENT` role has the id;
        - `urn:mentorhub:problem:student-already-enrolled`: the student has an active enrollment, on this or another
          track.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CohortEnrollmentConflict:
      description: |
        No enrollment was put into the cohort, and no cohort was created; nothing was changed. Problem type is one of,
        checked in this order:
        - `urn:mentorhub:problem:track-archived`: the track is archived and read-only until restored;
        - `urn:mentorhub:problem:enrollment-not-eligible`: an id given is not an active enrollment of the track.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CohortDeletionConflict:
      description: |
        The cohort was not deleted; nothing was changed. Problem type is one of, checked in this order:
        - `urn:mentorhub:problem:track-archived`: the track is archived and read-only until restored;
        - `urn:mentorhub:problem:cohort-not-empty`: an enrollment is in the cohort; taken out first, the cohort can be
          deleted.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CohortMentorConflict:
      description: |
        No mentor was assigned; nothing was changed. Problem type is one of, checked in this order:
        - `urn:mentorhub:problem:track-archived`: the track is archived and read-only until restored;
        - `urn:mentorhub:problem:mentor-not-eligible`: an id given is not a mentor of the cohort and no active user
          with the `MENTOR` role who is a mentor of the track has it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MentorNotEligible:
      description: |
        The user was not assigned; nothing was changed. Problem type `urn:mentorhub:problem:mentor-not-eligible`: the id
        is not a mentor of the enrollment and no active user with the `MENTOR` role who is a mentor of the enrollment's
        track has it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SystemInfo:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
          examples: [MentorHub]
        version:
          type: string
          examples: [0.0.1-SNAPSHOT]
    ClientConfig:
      type: object
      additionalProperties: false
      required: [issuer, clientId, scope, invitationEmails]
      properties:
        issuer:
          type: string
          format: uri
          examples: ['http://localhost:8180/realms/mentorhub']
        clientId:
          type: string
          examples: [mentorhub-web]
        scope:
          type: string
          description: Space-separated OIDC scopes to request.
          examples: [openid profile email]
        invitationEmails:
          type: boolean
          description: |
            Whether a mail server is configured, so invitation emails can be requested. When `false`, every request
            to send an email responds 409 `email-unavailable`.
    AccessStatus:
      type: string
      description: |
        - `ACTIVE`: a linked, active user;
        - `DISABLED`: a linked user whose access has ended;
        - `NOT_INVITED`: the identity is not linked to any user.
      enum: [ACTIVE, DISABLED, NOT_INVITED]
    Me:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/AccessStatus'
        user:
          $ref: '#/components/schemas/MeUser'
          description: Present only when `status` is `ACTIVE`; absent (not `null`) otherwise.
    MeUser:
      type: object
      additionalProperties: false
      required: [id, email, firstName, lastName, phone, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          examples: [anna@example.com]
        firstName:
          type: [string, 'null']
          examples: [Anna]
        lastName:
          type: [string, 'null']
          examples: [Petrova]
        phone:
          type: [string, 'null']
          description: E.164.
          examples: ['+77011234567']
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          description: The union of the permissions of all roles.
          items:
            $ref: '#/components/schemas/Permission'
    Role:
      type: string
      description: Must equal the `Role` enum in the backend code.
      enum: [ADMIN, COORDINATOR, MENTOR, STUDENT]
    Permission:
      type: string
      description: Must equal the `Permission` enum in the backend code.
      enum:
        - USERS_READ
        - USERS_MANAGE
        - USERS_INVITE
        - TRACKS_READ
        - TRACKS_MANAGE
        - ENROLLMENTS_READ
        - ENROLLMENTS_MANAGE
        - ENROLLMENTS_MANAGE_COORDINATED
        - ENROLLMENTS_READ_MENTORED
    Problem:
      type: object
      description: |
        RFC 9457 Problem Details. MentorHub problem types:
        `urn:mentorhub:problem:unauthorized`, `urn:mentorhub:problem:not-invited`,
        `urn:mentorhub:problem:access-ended`, `urn:mentorhub:problem:forbidden`,
        `urn:mentorhub:problem:not-found`, `urn:mentorhub:problem:validation-failed`
        (schema `ValidationProblem`), `urn:mentorhub:problem:self-lockout`,
        `urn:mentorhub:problem:last-admin`, `urn:mentorhub:problem:invitation-invalid`,
        `urn:mentorhub:problem:user-active` and `urn:mentorhub:problem:invitation-exists`
        (schema `InvitationConflictProblem`), `urn:mentorhub:problem:invitation-closed`,
        `urn:mentorhub:problem:invitation-expired`, `urn:mentorhub:problem:invitation-email-mismatch`,
        `urn:mentorhub:problem:identity-linked-elsewhere`, `urn:mentorhub:problem:email-unavailable`,
        `urn:mentorhub:problem:email-queued`, `urn:mentorhub:problem:track-archived`,
        `urn:mentorhub:problem:coordinator-not-eligible`, `urn:mentorhub:problem:track-has-active-enrollments`,
        `urn:mentorhub:problem:student-not-eligible`, `urn:mentorhub:problem:student-already-enrolled`,
        `urn:mentorhub:problem:mentor-not-eligible`, `urn:mentorhub:problem:mentor-leads-enrollments`,
        `urn:mentorhub:problem:mentor-leads-cohorts`,
        `urn:mentorhub:problem:enrollment-not-eligible`, `urn:mentorhub:problem:cohort-not-empty`,
        `urn:mentorhub:problem:cohort-not-eligible`.
        Other errors use `about:blank`.
        Other RFC 9457 members (such as `instance`) may be present.
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          examples: ['urn:mentorhub:problem:forbidden']
        title:
          type: string
          examples: [Forbidden]
        status:
          type: integer
          format: int32
          examples: [403]
        detail:
          type: string
    ValidationProblem:
      description: A `Problem` of type `urn:mentorhub:problem:validation-failed`.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          additionalProperties: true
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/ValidationError'
    InvitationConflictProblem:
      description: |
        A `Problem` of type `urn:mentorhub:problem:user-active` (with `userId`) or
        `urn:mentorhub:problem:invitation-exists` (with `invitationId`).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          additionalProperties: true
          properties:
            userId:
              type: string
              format: uuid
              description: The active user with the email. Present only for `user-active`.
            invitationId:
              type: string
              format: uuid
              description: The open invitation for the email. Present only for `invitation-exists`.
    ValidationError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: The query or path parameter name, or the request body property name.
          examples: [size]
        message:
          type: string
          examples: [must be between 1 and 100]
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    RoleFilter:
      type: string
      description: |
        A `Role`, or `NONE` for users without any role the server knows. Must equal the `Role` values plus `NONE`.
      enum: [ADMIN, COORDINATOR, MENTOR, STUDENT, NONE]
    DisableReason:
      type: string
      description: |
        Why a user was disabled. Must equal the `DisableReason` enum in the backend code.
        - `GRADUATED`: graduated;
        - `EXPELLED`: expelled;
        - `LEFT_PROGRAM`: left the program;
        - `STAFF_OFFBOARDED`: no longer on staff;
        - `SECURITY`: security concern;
        - `OTHER`: other; a comment is required.
      enum: [GRADUATED, EXPELLED, LEFT_PROGRAM, STAFF_OFFBOARDED, SECURITY, OTHER]
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, email, firstName, lastName, status, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          examples: [ivan@example.com]
        firstName:
          type: [string, 'null']
          examples: [Ivan]
        lastName:
          type: [string, 'null']
          examples: [Sidorov]
        status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          description: The user's roles the server knows.
          items:
            $ref: '#/components/schemas/Role'
    UserDetails:
      type: object
      description: '`UserSummary` with the profile, the disable reason and the creation time.'
      additionalProperties: false
      required: [id, email, firstName, lastName, phone, status, roles, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          examples: [ivan@example.com]
        firstName:
          type: [string, 'null']
          examples: [Ivan]
        lastName:
          type: [string, 'null']
          examples: [Sidorov]
        phone:
          type: [string, 'null']
          description: E.164.
          examples: ['+77011234567']
        status:
          $ref: '#/components/schemas/UserStatus'
        disabledReason:
          $ref: '#/components/schemas/DisableReason'
          description: Present only when `status` is `DISABLED`; absent (not `null`) otherwise.
        disabledComment:
          type: string
          description: Present only when `status` is `DISABLED` and a comment was given; absent (not `null`) otherwise.
          examples: [Finished the spring cohort]
        roles:
          type: array
          description: The user's roles the server knows.
          items:
            $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
    UserPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        page:
          type: integer
          format: int32
          description: Zero-based page number.
        size:
          type: integer
          format: int32
          description: The requested page size.
        totalItems:
          type: integer
          format: int64
          description: The number of matching items on all pages.
    DisableRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/DisableReason'
        comment:
          type: string
          description: Optional except for `OTHER`. Trimmed; at most 500 characters after trimming; blank means none.
          examples: [Finished the spring cohort]
    RolesUpdate:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          description: The complete set of roles the user should have; may be empty.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
    ProfileUpdate:
      type: object
      description: The whole profile; every property must be sent, `null` or blank for none.
      additionalProperties: false
      required: [firstName, lastName, phone]
      properties:
        firstName:
          type: [string, 'null']
          description: Trimmed; at most 100 characters after trimming.
          examples: [Ivan]
        lastName:
          type: [string, 'null']
          description: Trimmed; at most 100 characters after trimming.
          examples: [Sidorov]
        phone:
          type: [string, 'null']
          description: |
            Parsed with the server's default region when written without `+`; must be a valid number.
            Stored and returned in E.164.
          examples: [8 701 123 45 67]
    HistoryAction:
      type: string
      description: |
        The actions a user's history shows. A feature that writes a new action about a user extends this enum
        in the same change.
        - `USER_DISABLED`: details `reason`, `comment`;
        - `USER_ENABLED`: details `reason`, `comment` the user had been disabled with;
        - `USER_ROLES_CHANGED`: details `rolesAdded`, `rolesRemoved`;
        - `USER_PROFILE_UPDATED`: details `changes`;
        - `USER_BOOTSTRAPPED_ADMIN`: details `bootstrap`; no actor;
        - `USER_INVITATION_ACCEPTED`: details `invitation`, `rolesAdded`, `rolesRemoved`; the actor is the user;
        - `USER_TRACK_COORDINATOR_ADDED`: details `track`; the user was named a coordinator of the track;
        - `USER_TRACK_COORDINATOR_REMOVED`: details `track`; the user was removed as a coordinator of the track;
        - `USER_TRACK_MENTOR_ADDED`: details `track`; the user was named a mentor of the track;
        - `USER_TRACK_MENTOR_REMOVED`: details `track`; the user was removed as a mentor of the track;
        - `USER_ENROLLED`: details `track`, `startDate`, and `cohort` when the user was enrolled into one; the user
          was enrolled on the track;
        - `USER_MENTOR_ASSIGNED`: details `mentor`, `track`; the mentor was assigned to the user's enrollment on the
          track;
        - `USER_MENTOR_REMOVED`: details `mentor`, `track`; the mentor was removed from the user's enrollment on the
          track;
        - `USER_STUDENT_ASSIGNED`: details `user`, `track`; the user was assigned as a mentor of the enrollment of the
          student `user` on the track;
        - `USER_STUDENT_REMOVED`: details `user`, `track`; the user was removed as a mentor of the enrollment of the
          student `user` on the track;
        - `USER_COHORT_CHANGED`: details `track`, `cohortChange`; the user's enrollment on the track was put into a
          cohort, moved to another or taken out;
        - `USER_COHORT_MENTOR_ASSIGNED`: details `cohort`, `track`; the user was assigned as a mentor of the cohort of
          the track;
        - `USER_COHORT_MENTOR_REMOVED`: details `cohort`, `track`; the user was removed as a mentor of the cohort of
          the track, or the cohort was deleted.
      enum:
        - USER_DISABLED
        - USER_ENABLED
        - USER_ROLES_CHANGED
        - USER_PROFILE_UPDATED
        - USER_BOOTSTRAPPED_ADMIN
        - USER_INVITATION_ACCEPTED
        - USER_TRACK_COORDINATOR_ADDED
        - USER_TRACK_COORDINATOR_REMOVED
        - USER_TRACK_MENTOR_ADDED
        - USER_TRACK_MENTOR_REMOVED
        - USER_ENROLLED
        - USER_MENTOR_ASSIGNED
        - USER_MENTOR_REMOVED
        - USER_STUDENT_ASSIGNED
        - USER_STUDENT_REMOVED
        - USER_COHORT_CHANGED
        - USER_COHORT_MENTOR_ASSIGNED
        - USER_COHORT_MENTOR_REMOVED
    HistoryActor:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: First and last name joined by a space, or the email when both are missing.
          examples: [Anna Petrova]
    HistoryEntry:
      type: object
      description: |
        One change to a user. Detail properties that do not apply to the action are absent (not `null`).
      additionalProperties: false
      required: [id, occurredAt, action, actor]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        action:
          $ref: '#/components/schemas/HistoryAction'
        actor:
          description: Who made the change; `null` for a change made by the system.
          oneOf:
            - $ref: '#/components/schemas/HistoryActor'
            - type: 'null'
        reason:
          $ref: '#/components/schemas/DisableReason'
        comment:
          type: string
        rolesAdded:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        rolesRemoved:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ProfileChange'
        bootstrap:
          $ref: '#/components/schemas/BootstrapChanges'
        invitation:
          $ref: '#/components/schemas/InvitationAcceptance'
        track:
          $ref: '#/components/schemas/TrackReference'
        startDate:
          type: string
          format: date
          description: The start date of the enrollment.
        user:
          $ref: '#/components/schemas/HistoryActor'
          description: The student of the enrollment, with their name as it is now.
        mentor:
          $ref: '#/components/schemas/HistoryActor'
          description: The mentor assigned or removed, with their name as it is now.
        cohort:
          $ref: '#/components/schemas/CohortReference'
          description: |
            The cohort the user was enrolled into, or was assigned to or removed from as a mentor, with its name at
            that moment.
        cohortChange:
          $ref: '#/components/schemas/CohortChange'
    ProfileField:
      type: string
      enum: [firstName, lastName, phone]
    ProfileChange:
      type: object
      additionalProperties: false
      required: [field, oldValue, newValue]
      properties:
        field:
          $ref: '#/components/schemas/ProfileField'
        oldValue:
          type: [string, 'null']
        newValue:
          type: [string, 'null']
    BootstrapChanges:
      type: object
      description: What the administrator bootstrap did.
      additionalProperties: false
      required: [userCreated, identityLinked, enabled, adminAdded]
      properties:
        userCreated:
          type: boolean
        identityLinked:
          type: boolean
        enabled:
          type: boolean
        adminAdded:
          type: boolean
    InvitationAcceptance:
      type: object
      description: What accepting an invitation did. The roles added and removed are in `rolesAdded` and `rolesRemoved`.
      additionalProperties: false
      required: [invitationId, invitedBy, userCreated, identityLinked, enabled]
      properties:
        invitationId:
          type: string
          format: uuid
        invitedBy:
          description: The administrator who created the invitation; `null` when they cannot be resolved.
          oneOf:
            - $ref: '#/components/schemas/HistoryActor'
            - type: 'null'
        userCreated:
          type: boolean
        identityLinked:
          type: boolean
        enabled:
          type: boolean
          description: The user was disabled and has been enabled (reactivated).
    HistoryPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
        page:
          type: integer
          format: int32
          description: Zero-based page number.
        size:
          type: integer
          format: int32
          description: The requested page size.
        totalItems:
          type: integer
          format: int64
          description: The number of entries on all pages.
    InvitationStatus:
      type: string
      description: |
        Derived from the invitation's times, in this order:
        - `ACCEPTED`: accepted;
        - `REVOKED`: revoked;
        - `EXPIRED`: open, and the expiry has passed;
        - `PENDING`: open, and the link is valid.
      enum: [PENDING, EXPIRED, ACCEPTED, REVOKED]
    Invitation:
      type: object
      description: |
        An invitation. `acceptedAt` and `acceptedUser` are present only when accepted, `revokedAt` and `revokedBy` only
        when revoked, `lastEmail` only when an email was ever requested for it; absent (not `null`) otherwise. The
        link is never part of it.
      additionalProperties: false
      required: [id, email, roles, status, createdAt, expiresAt, createdBy]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          examples: [ivan@example.com]
        roles:
          type: array
          description: The roles the invitation gives that the server knows.
          items:
            $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/InvitationStatus'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/HistoryActor'
        acceptedAt:
          type: string
          format: date-time
        acceptedUser:
          $ref: '#/components/schemas/HistoryActor'
        revokedAt:
          type: string
          format: date-time
        revokedBy:
          $ref: '#/components/schemas/HistoryActor'
        lastEmail:
          $ref: '#/components/schemas/InvitationEmail'
    InvitationEmailStatus:
      type: string
      description: |
        - `QUEUED`: requested and not processed yet;
        - `SENT`: accepted by the configured mail server;
        - `FAILED`: the mail server refused it or could not be reached; there is no automatic retry;
        - `SKIPPED`: not sent, because the invitation was no longer pending when the email was about to be sent.
      enum: [QUEUED, SENT, FAILED, SKIPPED]
    InvitationEmail:
      type: object
      description: |
        The latest email requested for an invitation. `finishedAt` is present once the status is not `QUEUED`; absent
        (not `null`) otherwise.
      additionalProperties: false
      required: [status, requestedAt, requestedBy]
      properties:
        status:
          $ref: '#/components/schemas/InvitationEmailStatus'
        requestedAt:
          type: string
          format: date-time
        requestedBy:
          $ref: '#/components/schemas/HistoryActor'
        finishedAt:
          type: string
          format: date-time
    CreatedInvitation:
      type: object
      description: |
        An invitation with its link. While the invitation is pending, `GET /api/v1/invitations/{id}/link` returns the
        same link again.
      additionalProperties: false
      required: [invitation, link]
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        link:
          type: string
          format: uri
          description: '`<app-url>/invite/<token>`.'
          examples: ['http://localhost:4200/invite/Xf3kq9WvT0bD2mJ7sL1pR8yZ4cN6hA5eG0uI3oK9wQe']
    InvitationLink:
      type: object
      description: The link of a pending invitation.
      additionalProperties: false
      required: [link, email, expiresAt]
      properties:
        link:
          type: string
          format: uri
          description: '`<app-url>/invite/<token>`.'
          examples: ['http://localhost:4200/invite/Xf3kq9WvT0bD2mJ7sL1pR8yZ4cN6hA5eG0uI3oK9wQe']
        email:
          type: string
          examples: [ivan@example.com]
        expiresAt:
          type: string
          format: date-time
    InvitationPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        page:
          type: integer
          format: int32
          description: Zero-based page number.
        size:
          type: integer
          format: int32
          description: The requested page size.
        totalItems:
          type: integer
          format: int64
          description: The number of matching items on all pages.
    InvitationCreate:
      type: object
      additionalProperties: false
      required: [email, roles]
      properties:
        email:
          type: string
          description: Trimmed; a valid address of at most 254 characters after trimming.
          examples: [ivan@example.com]
        roles:
          type: array
          description: The roles the person gets on acceptance; may be empty.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
        sendEmail:
          type: boolean
          default: false
          description: Also email the link to the invited address. `true` needs a configured mail server.
    InvitationLinkReissue:
      type: object
      additionalProperties: false
      properties:
        sendEmail:
          type: boolean
          default: false
          description: Also email the new link to the invited address. `true` needs a configured mail server.
    InvitationToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: |
            The token from the link. Its length is bounded only to limit the public request body; any other malformed
            token responds 404 `invitation-invalid`.
          minLength: 1
          maxLength: 200
    InvitationPreview:
      type: object
      additionalProperties: false
      required: [email, expiresAt]
      properties:
        email:
          type: string
          examples: [ivan@example.com]
        expiresAt:
          type: string
          format: date-time
    TrackStatus:
      type: string
      description: |
        - `ACTIVE`: can be changed;
        - `ARCHIVED`: read-only until restored; keeps its coordinators and mentors.
      enum: [ACTIVE, ARCHIVED]
    TrackStatusFilter:
      type: string
      description: A `TrackStatus`, or `ALL` for every track. Must equal the `TrackStatus` values plus `ALL`.
      enum: [ACTIVE, ARCHIVED, ALL]
    TrackCreate:
      type: object
      description: The code and the name of a new track; both must be sent.
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          description: Trimmed; 1 to 20 characters after trimming.
          examples: [QA]
        name:
          type: string
          description: Trimmed; 1 to 100 characters after trimming.
          examples: [Quality Assurance]
    TrackUpdate:
      type: object
      description: The code and the name of a track, replacing both; both must be sent.
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          description: Trimmed; 1 to 20 characters after trimming.
          examples: [QA]
        name:
          type: string
          description: Trimmed; 1 to 100 characters after trimming.
          examples: [Quality Assurance]
    Track:
      type: object
      additionalProperties: false
      required: [id, code, name, status, coordinators, mentors, canEnroll]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          examples: [QA]
        name:
          type: string
          examples: [Quality Assurance]
        status:
          $ref: '#/components/schemas/TrackStatus'
        coordinators:
          type: array
          description: Sorted by name (case-insensitive), then by email; may be empty.
          items:
            $ref: '#/components/schemas/TrackCoordinator'
        mentors:
          type: array
          description: Sorted by name (case-insensitive), then by email; may be empty.
          items:
            $ref: '#/components/schemas/TrackMentor'
        canEnroll:
          type: boolean
          description: |
            The caller may enroll students on the track and name and remove its mentors: they hold
            `ENROLLMENTS_MANAGE`, or `ENROLLMENTS_MANAGE_COORDINATED` and are a coordinator of the track. Whatever the
            status: an archived track still refuses enrolling and any change to its mentors with 409 `track-archived`.
            The same check allows assigning and removing the mentors of the track's enrollments, and creating and
            deleting its cohorts and changing their enrollments and their mentors; an archived track refuses those
            with 409 `track-archived` too.
    TrackCoordinator:
      type: object
      description: |
        A coordinator of a track. The assignment grants nothing while the user is disabled or does not hold the
        `COORDINATOR` role; it stays until it is removed.
      additionalProperties: false
      required: [id, name, email, disabled, coordinatorRole]
      properties:
        id:
          type: string
          format: uuid
          description: The user's id.
        name:
          type: string
          description: First and last name joined by a space, or the email when both are missing.
          examples: [Anna Petrova]
        email:
          type: string
          examples: [anna@example.com]
        disabled:
          type: boolean
          description: The user is disabled.
        coordinatorRole:
          type: boolean
          description: The user holds the `COORDINATOR` role.
    TrackMentor:
      type: object
      description: |
        A mentor of a track. While the user is disabled or does not hold the `MENTOR` role, they are not assigned to
        the track's enrollments or cohorts; they stay a mentor of the track until removed.
      additionalProperties: false
      required: [id, name, email, disabled, mentorRole, students]
      properties:
        id:
          type: string
          format: uuid
          description: The user's id.
        name:
          type: string
          description: First and last name joined by a space, or the email when both are missing.
          examples: [Anna Petrova]
        email:
          type: string
          examples: [anna@example.com]
        disabled:
          type: boolean
          description: The user is disabled.
        mentorRole:
          type: boolean
          description: The user holds the `MENTOR` role.
        students:
          type: integer
          format: int32
          minimum: 0
          description: |
            The number of active enrollments on the track the user leads, as a mentor of the enrollment or of its
            cohort, each counted once, whatever the marks of their students. Needs no `ENROLLMENTS_READ`; listing
            those enrollments does (`listTrackEnrollments` with `mentor`).
    TrackList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Track'
    CoordinatorCandidate:
      type: object
      description: An active user with the `COORDINATOR` role.
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: First and last name joined by a space, or the email when both are missing.
          examples: [Anna Petrova]
        email:
          type: string
          examples: [anna@example.com]
    CoordinatorCandidateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CoordinatorCandidate'
    TrackHistoryAction:
      type: string
      description: |
        The actions a track's history shows. A feature that writes a new action about a track extends this enum
        in the same change.
        - `TRACK_CREATED`: details `code`, `name`;
        - `TRACK_UPDATED`: details `changes`, one per changed field;
        - `TRACK_ARCHIVED`: no details;
        - `TRACK_RESTORED`: no details;
        - `TRACK_COORDINATOR_ADDED`: details `user`;
        - `TRACK_COORDINATOR_REMOVED`: details `user`;
        - `TRACK_MENTOR_ADDED`: details `user`; the user was named a mentor of the track;
        - `TRACK_MENTOR_REMOVED`: details `user`; the user was removed as a mentor of the track;
        - `TRACK_STUDENT_ENROLLED`: details `user`, `startDate`, and `cohort` when the user was enrolled into one; the
          user was enrolled on the track;
        - `TRACK_ENROLLMENT_MENTOR_ASSIGNED`: details `user`, `mentor`; the mentor was assigned to the enrollment of
          the student `user` on the track;
        - `TRACK_ENROLLMENT_MENTOR_REMOVED`: details `user`, `mentor`; the mentor was removed from the enrollment of
          the student `user` on the track;
        - `TRACK_COHORT_CREATED`: details `cohort`, `startDate`; the cohort was created on the track;
        - `TRACK_COHORT_DELETED`: details `cohort`, `startDate`; the cohort was deleted;
        - `TRACK_ENROLLMENT_COHORT_CHANGED`: details `user`, `cohortChange`; the enrollment of the student `user` on
          the track was put into a cohort, moved to another or taken out;
        - `TRACK_COHORT_MENTOR_ASSIGNED`: details `cohort`, `mentor`; the mentor was assigned to the cohort;
        - `TRACK_COHORT_MENTOR_REMOVED`: details `cohort`, `mentor`; the mentor was removed from the cohort, or the
          cohort was deleted.
      enum:
        - TRACK_CREATED
        - TRACK_UPDATED
        - TRACK_ARCHIVED
        - TRACK_RESTORED
        - TRACK_COORDINATOR_ADDED
        - TRACK_COORDINATOR_REMOVED
        - TRACK_MENTOR_ADDED
        - TRACK_MENTOR_REMOVED
        - TRACK_STUDENT_ENROLLED
        - TRACK_ENROLLMENT_MENTOR_ASSIGNED
        - TRACK_ENROLLMENT_MENTOR_REMOVED
        - TRACK_COHORT_CREATED
        - TRACK_COHORT_DELETED
        - TRACK_ENROLLMENT_COHORT_CHANGED
        - TRACK_COHORT_MENTOR_ASSIGNED
        - TRACK_COHORT_MENTOR_REMOVED
    TrackHistoryEntry:
      type: object
      description: |
        One change to a track. Detail properties that do not apply to the action are absent (not `null`).
      additionalProperties: false
      required: [id, occurredAt, action, actor]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        action:
          $ref: '#/components/schemas/TrackHistoryAction'
        actor:
          description: Who made the change; `null` for a change made by the system.
          oneOf:
            - $ref: '#/components/schemas/HistoryActor'
            - type: 'null'
        code:
          type: string
          description: The code the track was created with.
          examples: [QA]
        name:
          type: string
          description: The name the track was created with.
          examples: [Quality Assurance]
        changes:
          type: array
          items:
            $ref: '#/components/schemas/TrackChange'
        user:
          $ref: '#/components/schemas/HistoryActor'
          description: |
            The user named or removed as a coordinator or a mentor of the track, or the student of the enrollment,
            with their name as it is now.
        startDate:
          type: string
          format: date
          description: The start date of the enrollment, or of the cohort created or deleted.
        mentor:
          $ref: '#/components/schemas/HistoryActor'
          description: The mentor assigned or removed, with their name as it is now.
        cohort:
          $ref: '#/components/schemas/CohortReference'
          description: |
            The cohort created or deleted, the cohort the student was enrolled into, or the cohort the mentor was
            assigned to or removed from, with its name at that moment.
        cohortChange:
          $ref: '#/components/schemas/CohortChange'
    TrackField:
      type: string
      enum: [code, name]
    TrackChange:
      type: object
      additionalProperties: false
      required: [field, oldValue, newValue]
      properties:
        field:
          $ref: '#/components/schemas/TrackField'
        oldValue:
          type: string
        newValue:
          type: string
    TrackHistoryPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackHistoryEntry'
        page:
          type: integer
          format: int32
          description: Zero-based page number.
        size:
          type: integer
          format: int32
          description: The requested page size.
        totalItems:
          type: integer
          format: int64
          description: The number of entries on all pages.
    TrackReference:
      type: object
      description: |
        A track with its code and name: in a user's history as they were at the moment of the change, elsewhere as they
        are now.
      additionalProperties: false
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          examples: [QA]
        name:
          type: string
          examples: [Quality Assurance]
    EnrollmentStatus:
      type: string
      description: |
        - `ACTIVE`: the student studies on the track.
      enum: [ACTIVE]
    EnrollmentCreate:
      type: object
      description: The student to enroll and the start date, both of which must be sent, and optionally a cohort.
      additionalProperties: false
      required: [studentId, startDate]
      properties:
        studentId:
          type: string
          format: uuid
          description: The user's id.
        startDate:
          type: string
          format: date
          description: Any date, past or future.
          examples: ['2026-09-01']
        cohortId:
          type: string
          format: uuid
          description: A cohort of the track to enroll into; without it the enrollment is in no cohort.
    EnrolledStudent:
      type: object
      description: |
        The student of an enrollment. The enrollment stays when the user is later disabled or loses the `STUDENT`
        role.
      additionalProperties: false
      required: [id, name, email, disabled, studentRole]
      properties:
        id:
          type: string
          format: uuid
          description: The user's id.
        name:
          type: string
          description: First and last name joined by a space, or the email when both are missing.
          examples: [Ivan Sidorov]
        email:
          type: string
          examples: [ivan@example.com]
        disabled:
          type: boolean
          description: The user is disabled.
        studentRole:
          type: boolean
          description: The user holds the `STUDENT` role.
    TrackEnrollment:
      type: object
      description: An enrollment as the enrollments of its track show it.
      additionalProperties: false
      required: [id, student, startDate, status, cohort, mentors]
      properties:
        id:
          type: string
          format: uuid
        student:
          $ref: '#/components/schemas/EnrolledStudent'
        startDate:
          type: string
          format: date
          examples: ['2026-09-01']
        status:
          $ref: '#/components/schemas/EnrollmentStatus'
        cohort:
          description: The cohort the enrollment is in, with its name as it is now; `null` for none.
          oneOf:
            - $ref: '#/components/schemas/CohortReference'
            - type: 'null'
        mentors:
          type: array
          description: |
            Every mentor who leads the enrollment, of the enrollment and of its cohort, each once, sorted by name
            (case-insensitive), then by email; may be empty.
          items:
            $ref: '#/components/schemas/EnrollmentMentor'
    EnrollmentMentor:
      type: object
      description: |
        A mentor who leads an enrollment, as a mentor of the enrollment or of its cohort. The assignment grants nothing
        while the user is disabled or does not hold the `MENTOR` role; it stays until it is removed.
      additionalProperties: false
      required: [id, name, email, disabled, mentorRole, throughCohort]
      properties:
        id:
          type: string
          format: uuid
          description: The user's id.
        name:
          type: string
          description: First and last name joined by a space, or the email when both are missing.
          examples: [Anna Petrova]
        email:
          type: string
          examples: [anna@example.com]
        disabled:
          type: boolean
          description: The user is disabled.
        mentorRole:
          type: boolean
          description: The user holds the `MENTOR` role.
        throughCohort:
          type: boolean
          description: |
            The user leads the enrollment only as a mentor of its cohort, not as a mentor of the enrollment itself; so
            they are not removed from it with `removeEnrollmentMentor`.
    TrackEnrollmentPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackEnrollment'
        page:
          type: integer
          format: int32
          description: Zero-based page number.
        size:
          type: integer
          format: int32
          description: The requested page size.
        totalItems:
          type: integer
          format: int64
          description: The number of matching items on all pages.
    EnrollmentCandidate:
      type: object
      description: An active user with the `STUDENT` role and no active enrollment.
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: First and last name joined by a space, or the email when both are missing.
          examples: [Ivan Sidorov]
        email:
          type: string
          examples: [ivan@example.com]
    EnrollmentCandidatePage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentCandidate'
        page:
          type: integer
          format: int32
          description: Zero-based page number.
        size:
          type: integer
          format: int32
          description: The requested page size.
        totalItems:
          type: integer
          format: int64
          description: The number of matching items on all pages.
    MentorCandidate:
      type: object
      description: |
        An active user with the `MENTOR` role who is not a mentor of the track it is listed for.
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: First and last name joined by a space, or the email when both are missing.
          examples: [Anna Petrova]
        email:
          type: string
          examples: [anna@example.com]
    MentorCandidatePage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MentorCandidate'
        page:
          type: integer
          format: int32
          description: Zero-based page number.
        size:
          type: integer
          format: int32
          description: The requested page size.
        totalItems:
          type: integer
          format: int64
          description: The number of matching items on all pages.
    MentorAssignmentCandidate:
      type: object
      description: |
        An active user with the `MENTOR` role who is a mentor of the track and not a mentor of the enrollment, or of
        the cohort, it is listed for, with what they lead on the track.
      additionalProperties: false
      required: [id, name, email, students, cohorts]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: First and last name joined by a space, or the email when both are missing.
          examples: [Anna Petrova]
        email:
          type: string
          examples: [anna@example.com]
        students:
          type: integer
          format: int32
          minimum: 0
          description: |
            The number of active enrollments on the track the user leads, as `TrackMentor.students` counts them.
        cohorts:
          type: integer
          format: int32
          minimum: 0
          description: The number of cohorts of the track the user is a mentor of, with enrollments or without.
    MentorAssignmentCandidatePage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MentorAssignmentCandidate'
        page:
          type: integer
          format: int32
          description: Zero-based page number.
        size:
          type: integer
          format: int32
          description: The requested page size.
        totalItems:
          type: integer
          format: int64
          description: The number of matching items on all pages.
    EnrollmentContact:
      type: object
      description: |
        A person the student of an enrollment contacts: a coordinator of the enrollment's track who is active and holds
        the `COORDINATOR` role, or a mentor of the enrollment or of its cohort who is active and holds the `MENTOR`
        role.
      additionalProperties: false
      required: [name, email, phone]
      properties:
        name:
          type: string
          description: First and last name joined by a space, or the email when both are missing.
          examples: [Anna Petrova]
        email:
          type: string
          examples: [anna@example.com]
        phone:
          type: [string, 'null']
          description: E.164.
          examples: ['+77011234567']
    MyEnrollment:
      type: object
      description: One of the caller's own enrollments.
      additionalProperties: false
      required: [id, track, startDate, status, coordinators, mentors]
      properties:
        id:
          type: string
          format: uuid
        track:
          $ref: '#/components/schemas/TrackReference'
          description: The track with its code and name as they are now.
        startDate:
          type: string
          format: date
          examples: ['2026-09-01']
        status:
          $ref: '#/components/schemas/EnrollmentStatus'
        coordinators:
          type: array
          description: Sorted by name (case-insensitive), then by email; may be empty.
          items:
            $ref: '#/components/schemas/EnrollmentContact'
        mentors:
          type: array
          description: |
            The mentors who lead the enrollment, of the enrollment and of its cohort, each once, who are active and
            hold the `MENTOR` role, sorted by name (case-insensitive), then by email; may be empty.
          items:
            $ref: '#/components/schemas/EnrollmentContact'
    MyEnrollmentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyEnrollment'
    MentoredEnrollment:
      type: object
      description: An enrollment the caller leads, as a mentor of the enrollment or of its cohort.
      additionalProperties: false
      required: [id, student, track, startDate, status, cohort, throughCohort]
      properties:
        id:
          type: string
          format: uuid
        student:
          $ref: '#/components/schemas/EnrolledStudent'
        track:
          $ref: '#/components/schemas/TrackReference'
          description: The track with its code and name as they are now.
        startDate:
          type: string
          format: date
          examples: ['2026-09-01']
        status:
          $ref: '#/components/schemas/EnrollmentStatus'
        cohort:
          description: The cohort the enrollment is in, with its name as it is now; `null` for none.
          oneOf:
            - $ref: '#/components/schemas/CohortReference'
            - type: 'null'
        throughCohort:
          type: boolean
          description: The caller leads the enrollment only as a mentor of its cohort, not of the enrollment itself.
    MentoredEnrollmentPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MentoredEnrollment'
        page:
          type: integer
          format: int32
          description: Zero-based page number.
        size:
          type: integer
          format: int32
          description: The requested page size.
        totalItems:
          type: integer
          format: int64
          description: The number of matching items on all pages.
    CohortReference:
      type: object
      description: |
        A cohort with its name: in a history as it was at the moment of the change, elsewhere as it is now. A cohort in
        a history may since have been deleted.
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Spring 2026]
    CohortChange:
      type: object
      description: |
        The cohorts of an enrollment before and after a change, each with its name at that moment: `from` is `null`
        when the enrollment was put into a cohort from none, `to` is `null` when it was taken out.
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          oneOf:
            - $ref: '#/components/schemas/CohortReference'
            - type: 'null'
        to:
          oneOf:
            - $ref: '#/components/schemas/CohortReference'
            - type: 'null'
    Cohort:
      type: object
      description: A cohort of a track, an intake.
      additionalProperties: false
      required: [id, name, startDate, enrollmentCount, mentors]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Spring 2026]
        startDate:
          type: string
          format: date
          description: Any date; it need not match the start dates of the cohort's enrollments.
          examples: ['2026-03-01']
        enrollmentCount:
          type: integer
          format: int32
          minimum: 0
          description: The number of active enrollments in the cohort, whatever the marks of their students.
        mentors:
          type: array
          description: |
            The mentors of the cohort, who lead each of its active enrollments, sorted by name (case-insensitive), then
            by email; may be empty.
          items:
            $ref: '#/components/schemas/CohortMentor'
    CohortMentor:
      type: object
      description: |
        A mentor of a cohort. The assignment grants nothing while the user is disabled or does not hold the `MENTOR`
        role; it stays until it is removed.
      additionalProperties: false
      required: [id, name, email, disabled, mentorRole]
      properties:
        id:
          type: string
          format: uuid
          description: The user's id.
        name:
          type: string
          description: First and last name joined by a space, or the email when both are missing.
          examples: [Anna Petrova]
        email:
          type: string
          examples: [anna@example.com]
        disabled:
          type: boolean
          description: The user is disabled.
        mentorRole:
          type: boolean
          description: The user holds the `MENTOR` role.
    CohortList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cohort'
    CohortCreate:
      type: object
      description: A new cohort; the name and the start date must be sent.
      additionalProperties: false
      required: [name, startDate]
      properties:
        name:
          type: string
          description: Trimmed; 1 to 100 characters after trimming.
          examples: [Spring 2026]
        startDate:
          type: string
          format: date
          description: Any date, past or future.
          examples: ['2026-03-01']
        enrollmentIds:
          type: array
          description: The enrollments of the track to put into the cohort; may be empty or left out.
          items:
            type: string
            format: uuid
    CohortEnrollmentsAddition:
      type: object
      description: The enrollments to add to a cohort.
      additionalProperties: false
      required: [enrollmentIds]
      properties:
        enrollmentIds:
          type: array
          description: The enrollments of the track to put into the cohort; at least one.
          minItems: 1
          items:
            type: string
            format: uuid
    CohortCandidate:
      type: object
      description: An active enrollment of the track that is not in the cohort it is listed for.
      additionalProperties: false
      required: [id, student, cohort]
      properties:
        id:
          type: string
          format: uuid
          description: The enrollment's id.
        student:
          $ref: '#/components/schemas/EnrolledStudent'
        cohort:
          description: The cohort the enrollment is in now; `null` for none.
          oneOf:
            - $ref: '#/components/schemas/CohortReference'
            - type: 'null'
    CohortCandidatePage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CohortCandidate'
        page:
          type: integer
          format: int32
          description: Zero-based page number.
        size:
          type: integer
          format: int32
          description: The requested page size.
        totalItems:
          type: integer
          format: int64
          description: The number of matching items on all pages.
    CohortMentorsAssignment:
      type: object
      description: The users to assign as mentors of a cohort.
      additionalProperties: false
      required: [userIds]
      properties:
        userIds:
          type: array
          description: The mentors of the track to assign; at least one.
          minItems: 1
          items:
            type: string
            format: uuid
