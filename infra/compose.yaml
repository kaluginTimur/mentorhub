name: mentorhub

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: mentorhub
      POSTGRES_USER: mentorhub
      POSTGRES_PASSWORD: mentorhub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ keeps data in a versioned subdirectory, so mount the parent
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentorhub -d mentorhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: keycloak/keycloak:26.8.1
    # Development mode keeps its data inside the container. --import-realm skips a realm that already exists, so a
    # changed realm file takes effect only in a recreated container.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Fixed so the token issuer is always http://localhost:8180/realms/mentorhub
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/mentorhub-realm.json:/opt/keycloak/data/import/mentorhub-realm.json:ro
    labels:
      # The backend creates token decoders on the first token, so it does not wait for Keycloak at startup.
      org.springframework.boot.readiness-check.disable: "true"

  mailpit:
    # Catches all local email (MentorHub invitation emails, Keycloak verification and password reset); nothing leaves the machine
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
