name: mentorhub

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: mentorhub
      POSTGRES_USER: mentorhub
      POSTGRES_PASSWORD: mentorhub
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ keeps data in a versioned subdirectory, so mount the parent
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentorhub -d mentorhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
