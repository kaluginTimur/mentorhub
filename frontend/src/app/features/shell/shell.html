<header>
  <mat-toolbar>
    <span class="brand">MentorHub</span>
    @if (canReadUsers()) {
      <a matButton routerLink="/users" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Users</a
      >
    }
    @if (canInvite()) {
      <a matButton routerLink="/invitations" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Invitations</a
      >
    }
    <span class="spacer"></span>
    <button
      matButton
      type="button"
      [matMenuTriggerFor]="userMenu"
      [attr.aria-label]="'Account menu for ' + name()"
    >
      {{ name() }}
      <mat-icon iconPositionEnd aria-hidden="true">arrow_drop_down</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu" xPosition="before" [aria-label]="name() + ', ' + email()">
      <div class="user-info">
        <div class="user-name">{{ name() }}</div>
        <div class="user-email">{{ email() }}</div>
      </div>
      <a mat-menu-item routerLink="/profile">Profile</a>
      <button mat-menu-item type="button" (click)="signOut()">Sign out</button>
    </mat-menu>
  </mat-toolbar>
</header>

<router-outlet />
