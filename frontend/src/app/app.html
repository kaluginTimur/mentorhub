@if (startupError()) {
  @defer (on immediate) {
    <app-unavailable (retry)="reload()" />
  } @error {
    <main role="alert">
      <h1>MentorHub is unavailable. Try again later.</h1>
      <button type="button" (click)="reload()">Retry</button>
    </main>
  }
} @else {
  @if (loading()) {
    @defer (on immediate) {
      <app-loading />
    }
  }
  <div [attr.aria-busy]="loading()">
    <router-outlet />
  </div>
}
