<mat-toolbar>
  <h1>MentorHub</h1>
</mat-toolbar>

<main>
  <mat-card appearance="outlined">
    <mat-card-content>
      @if (systemInfo.isLoading()) {
        <p>Connecting to the server…</p>
      } @else if (systemInfo.error()) {
        <p role="alert">Server is unavailable</p>
      } @else if (systemInfo.value(); as info) {
        <p>{{ info.name }} · version {{ info.version }}</p>
      }
    </mat-card-content>
  </mat-card>
</main>

<router-outlet />
